apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  labels:
    app: myapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
      - name: myapp
        image: piyush63/yourapp:bd5901bf89bcc8a132af7d8a200a7339020cf273
        ports:
        - containerPort: 5000

