apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  labels:
    app: myapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
      - name: myapp
        image: piyush63/yourapp:1aedb544f35882355cba86aa2c0978dabd09bb96
        ports:
        - containerPort: 5000

